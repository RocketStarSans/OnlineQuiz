{% extends 'OnlineQuiz/base.html' %}

{% block title %}Редагування — {{ quiz.title }}{% endblock %}

{% block content %}
    <div class="auth-card">
        <h2>Редагувати вікторину</h2>
        <form method="post">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit" class="btn-submit">Зберегти зміни</button>
        </form>
    </div>
{% endblock %}
