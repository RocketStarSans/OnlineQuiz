{% extends 'OnlineQuiz/base.html' %}

{% block title %}Реєстрація — Online Quiz{% endblock %}

{% block content %}

        <h2>Реєстрація</h2>

            {% csrf_token %}
            {{ form.as_p }}

        </form>
    </div>
{% endblock %}
