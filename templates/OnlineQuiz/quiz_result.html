{% extends 'OnlineQuiz/base.html' %}

{% block title %}Результат — {{ quiz.title }}{% endblock %}

{% block content %}
    <div class="card shadow-sm border-0 mx-auto text-center" style="max-width: 500px;">
        <div class="card-body">
            <h2 class="fw-bold mb-3">Вікторина «{{ quiz.title }}» завершена!</h2>
            <p class="display-6 mb-4">{{ score }} / {{ total }}</p>
            <a href="{% url 'start_quiz' quiz.id %}" class="btn btn-primary w-100 mb-2">Пройти ще раз</a>
            <a href="{% url 'detail_quiz' quiz.id %}" class="btn btn-outline-secondary w-100">← Повернутись до вікторини</a>
        </div>
    </div>
{% endblock %}
